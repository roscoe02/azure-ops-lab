# What the status page checks. Every check is defined here, in git.
storage:
  type: sqlite
  path: /data/data.db

ui:
  title: "Ethan Roscoe | Service Status"
  header: "Service status"
  description: "Uptime for my portfolio, AI agent, and projects. Runs on an Azure VM built with Terraform."
  link: "https://ethanroscoe.com"

endpoints:
  - name: Portfolio site
    group: Portfolio
    url: "https://ethanroscoe.com/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"

  - name: Skills radar data
    group: Portfolio
    url: "https://ethanroscoe.com/data/radar.json"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].postings_analyzed > 0"

  # CORS preflight only: proves the Worker is up without calling the Claude API (no cost per check)
  - name: AI agent (Cloudflare Worker)
    group: Portfolio
    url: "https://ask.ethanroscoe.com"
    method: OPTIONS
    headers:
      Origin: "https://ethanroscoe.com"
      Access-Control-Request-Method: "POST"
    interval: 5m
    conditions:
      - "[STATUS] == 204"

  - name: AD home lab repo
    group: GitHub
    url: "https://github.com/roscoe02/ad-homelab"
    interval: 30m
    conditions:
      - "[STATUS] == 200"

  - name: Network scanner repo
    group: GitHub
    url: "https://github.com/roscoe02/network-scanner"
    interval: 30m
    conditions:
      - "[STATUS] == 200"
